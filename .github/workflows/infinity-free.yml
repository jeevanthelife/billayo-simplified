#Did as per https://fortunedevs.hashnode.dev/deploy-laravel-12-to-infinityfree-using-github-actions-and-ftp

name: Deploy to billayo.xo.je/

# Run manually or on push to the infinityfree-hosting branch
on:
  workflow_dispatch:
  push:
    branches:
      - infinityfree-hosting

jobs:
  deploy:
    name: Deploy via FTP
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the latest code from GitHub
      - name: Get latest code
        uses: actions/checkout@v4

      # Step 2: Upload code via FTP
      - name: Deploy to billayo.xo.je/ via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftpupload.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /htdocs/  # For addon domains
          timeout: 86400000
          log-level: standard
